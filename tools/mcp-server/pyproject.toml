[project]
name = "mcp-rmg-rfid-station-knowledge"
version = "0.1.0"
description = "MCP server serving rnd-southerniot/app-rmg-rfid-station-fw (RMG RFID station, ESP32 + RAK3212 ESP32-S3/SX1262 LoRaWAN fallback) knowledge"
requires-python = ">=3.11"
dependencies = [
    # Pinned <2.0: mcp 2.0.0 removed mcp.server.fastmcp, so an unpinned spec resolves to 2.x
    # and the service fails at import. The fleet is on 1.x (1.28.0-1.30.0 as of 2026-09-23).
    "mcp[cli]>=1.26.0,<2.0",
]
