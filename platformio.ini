; PlatformIO configuration for RMG RFID Station Firmware
;
; Environments
;   esp32dev          original station PCB (ESP32 + MFRC522 + ILI9341/FT6336)     — values unchanged
;   rak3212           RAK3212 WisDuo breakout (ESP32-S3 + SX1262) + lcdwiki MSP2834 + UART RFID reader
;   rak3212-bringup   Phase-1 board bring-up sketch only (blink + USB CDC + PSRAM)
;   native            host-native unit tests for the pure modules (pio test -e native)
;
; Pin maps: src/boards/board_<env>.h and docs/PIN_MAP.md.

[platformio]
default_envs = esp32dev, rak3212

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI font set shared by both boards (verbatim from the original config)
[tft_fonts]
build_flags =
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; ── Original board: every value below is unchanged from the single-env config ──────────
[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
upload_speed = 921600
lib_deps =
    ${env.lib_deps}
    miguelbalboa/MFRC522@^1.4.11
build_src_filter = +<*> -<rfid_uart.cpp> -<rfid_frame.cpp> -<lora_link.cpp> -<lora_payload.cpp> -<serial_console.cpp> -<bringup/>
build_flags =
    -DBOARD_ESP32DEV=1
    ; TFT_eSPI configuration (ILI9341 on VSPI)
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_MISO=19
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ${tft_fonts.build_flags}

; ── RAK3212 breakout (RAK3112 module: ESP32-S3, 16 MB quad flash, 8 MB octal PSRAM, SX1262) ──
[env:rak3212]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Native USB-Serial-JTAG: an asserted DTR/RTS from the monitor holds the S3 in reset
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
lib_deps =
    ${env.lib_deps}
    ; exact pin: the version bench-proven on this module (sibling siot-lorawan-node)
    jgromes/RadioLib@7.7.1
build_src_filter = +<*> -<rfid_mfrc522.cpp> -<bringup/>
build_flags =
    -DBOARD_RAK3212=1
    -DBOARD_HAS_PSRAM
    ; Serial = native USB CDC (HWCDC); Serial0 stays on GPIO43/44 as the fallback console
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; TFT_eSPI: lcdwiki MSP2834 (ILI9341V) on SPI3. USE_HSPI_PORT is MANDATORY on the ESP32-S3:
    ; the default FSPI register mapping in TFT_eSPI 2.5.x crashes on the first write.
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=10
    -DTFT_MOSI=11
    -DTFT_SCLK=13
    -DTFT_CS=12
    -DTFT_DC=38
    -DTFT_RST=39
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ${tft_fonts.build_flags}

; Phase-1 bring-up sketch only (LED/buzzer/USB CDC/PSRAM); no application code, no libraries
[env:rak3212-bringup]
extends = env:rak3212
lib_deps =
build_src_filter = -<*> +<bringup/p1_blink.cpp>

; Host-native unit tests for the Arduino-free modules
[env:native]
platform = native
framework =
; do not inherit the firmware libraries (they need Arduino.h); Unity comes from test_framework
lib_deps = throwtheswitch/Unity@^2.6.1
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<rfid_frame.cpp> +<lora_payload.cpp>
build_flags = -std=gnu++17 -DUNIT_TEST -Wall -Wextra
